<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>تطبيق تبيــان</title>
    <!-- خط Noto Naskh Arabic المخصص للقرآن الكريم والتوافق التام مع التشكيل -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf8f2;
            --header-bg: #f3ede2;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --accent-color: #1b4d3e;
            --border-color: #e0e0e0;
            --gold-accent: #c5a059;
            --highlight-bg: rgba(197, 160, 89, 0.25);
            --quran-font-size: 22px;
            --adhkar-font-size: 18px;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --header-bg: #1e1e1e;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #2d6a4f;
            --border-color: #333333;
            --gold-accent: #d4af37;
            --highlight-bg: rgba(212, 175, 55, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
        }

        .top-header {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 50px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
        }

        .header-title { 
            font-family: 'Aref Ruqaa', serif;
            font-weight: 700; 
            font-size: 24px; 
            color: var(--gold-accent);
            letter-spacing: 1px;
        }

        .menu-btn {
            background: none;
            color: var(--text-color);
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -320px;
            width: 300px;
            height: 100%;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-shadow: -2px 0 12px rgba(0,0,0,0.2);
            z-index: 200;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar.open { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin-bottom: 15px;
            font-size: 14px;
        }

        .menu-list { list-style: none; }
        .menu-item { padding: 12px 10px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-weight: 600; }
        .sub-menu { list-style: none; padding-right: 15px; display: none; max-height: 250px; overflow-y: auto; }
        .sub-menu.open { display: block; }
        .sub-menu li { 
            padding: 10px 0; 
            font-family: 'Noto Naskh Arabic', serif; 
            font-size: 15px; 
            cursor: pointer; 
            border-bottom: 1px dashed var(--border-color); 
        }

        .main-container {
            width: 100vw;
            height: 100vh;
            padding-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .quran-wrapper {
            width: 100%;
            height: 100%;
            padding: 10px 10px 55px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- تصميم الإطار المزدوج (فردي وزوجي) --- */
        .quran-frame {
            width: 100%;
            max-width: 800px;
            height: calc(100vh - 120px);
            border: 5px double var(--gold-accent);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            background-color: var(--card-bg);
            position: relative;
            overflow: hidden;
            transition: padding 0.2s ease, border-color 0.2s ease;
        }

        /* الصفحة الفردية (اليسرى من المصحف) */
        .quran-frame.odd-page {
            padding: 8px 18px 8px 8px;
            border-right: 8px solid var(--gold-accent);
            border-left: 3px double var(--gold-accent);
        }

        /* الصفحة الزوجية (اليمنى من المصحف) */
        .quran-frame.even-page {
            padding: 8px 8px 8px 18px;
            border-left: 8px solid var(--gold-accent);
            border-right: 3px double var(--gold-accent);
        }

        .quran-page {
            font-family: 'Noto Naskh Arabic', serif;
            font-size: var(--quran-font-size);
            line-height: 2.2;
            text-align: justify;
            text-justify: inter-word;
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: var(--text-color);
            direction: rtl;
        }

        .ayah-span {
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s ease, color 0.2s ease;
            user-select: none;
            padding: 0 2px;
        }

        .ayah-span.playing {
            background-color: var(--highlight-bg);
            color: var(--accent-color);
            font-weight: bold;
        }

        .surah-banner {
            font-family: 'Cairo', sans-serif;
            border: 2px solid var(--accent-color);
            background-color: var(--bg-color);
            text-align: center;
            padding: 4px;
            margin: 6px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
            color: var(--accent-color);
        }

        .andalusian-bookmark {
            font-size: 26px;
            color: #000000;
            cursor: pointer;
            transition: color 0.3s, transform 0.2s;
            user-select: none;
            vertical-align: middle;
            margin-right: 6px;
        }

        [data-theme="dark"] .andalusian-bookmark { color: #ffffff; }

        .andalusian-bookmark.active {
            color: var(--gold-accent) !important;
            transform: scale(1.2);
        }

        .page-controls-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 52px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            z-index: 10;
            direction: rtl;
        }

        .surah-info-box { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: bold; }
        .page-counter-box { display: flex; align-items: center; gap: 4px; }

        .page-input {
            width: 48px;
            text-align: center;
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--bg-color);
            color: var(--text-color);
            font-weight: bold;
            font-size: 13px;
        }

        .btn-go, .btn-bookmark-jump {
            border: none;
            padding: 5px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .btn-go { background-color: var(--accent-color); }
        .btn-bookmark-jump { background-color: var(--gold-accent); }

        .content-section {
            display: none;
            width: 100%;
            height: calc(100vh - 50px);
            padding: 20px 15px;
            overflow-y: auto;
        }

        .dhikr-card, .prayer-card, .tasbeeh-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            text-align: center;
        }

        .dhikr-text { 
            font-family: 'Noto Naskh Arabic', serif; 
            font-size: var(--adhkar-font-size); 
            line-height: 2; 
            margin-bottom: 10px; 
            text-align: justify;
            color: var(--text-color);
        }
        
        .dhikr-count { display: inline-block; background-color: var(--accent-color); color: white; padding: 4px 12px; border-radius: 15px; font-size: 13px; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 150; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="top-header">
        <button class="menu-btn" onclick="toggleSidebar(event)">☰</button>
        <span class="header-title">تبيــان</span>
        <div style="width: 24px;"></div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSidebar(event)"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>القائمة الرئيسية</h3>
            <span onclick="toggleSidebar(event)" style="cursor:pointer; font-size:20px;">✕</span>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="🔍 بحث في الأذكار..." onkeyup="handleSearch(this.value)">

        <ul class="menu-list">
            <li class="menu-item" onclick="showSection('quran')">📖 المصحف الشريف</li>
            <li class="menu-item" onclick="toggleSubMenu('surahIndexMenu')">📑 فهرس السور ▾
                <ul class="sub-menu" id="surahIndexMenu"><div id="surahsList">جاري التحميل...</div></ul>
            </li>
            <li class="menu-item" onclick="toggleSubMenu('juzIndexMenu')">📖 فهرس الأجزاء ▾
                <ul class="sub-menu" id="juzIndexMenu"><div id="juzList">جاري التحميل...</div></ul>
            </li>
            <li class="menu-item" onclick="toggleSubMenu('adhkarMenu')">🤲 أذكاري ▾
                <ul class="sub-menu" id="adhkarMenu">
                    <li onclick="loadAdhkarCategory('morning')">أذكار الصباح</li>
                    <li onclick="loadAdhkarCategory('evening')">أذكار المساء</li>
                </ul>
            </li>
        </ul>
    </div>

    <div class="main-container" id="mainContainer">
        <div id="quranSection" class="quran-wrapper">
            <!-- الإطار يتحول تلقائياً من فردي لزوجي بواسطة JavaScript -->
            <div class="quran-frame odd-page" id="quranFrame">
                <div class="quran-page" id="quranText">جاري التحميل...</div>
            </div>

            <div class="page-controls-footer">
                <div class="surah-info-box">
                    <span>سورة: <span id="footerSurahName">-</span></span>
                    <span class="andalusian-bookmark" id="footerBookmark" onclick="toggleBookmark(event)" title="حفظ الصفحة">۞</span>
                </div>
                
                <div class="page-counter-box">
                    <span>ص:</span>
                    <input type="number" id="pageInput" class="page-input" min="1" max="604" value="1">
                    <button class="btn-go" onclick="jumpToPage()">انتقال</button>
                    <button class="btn-bookmark-jump" onclick="goToBookmark()">علامتي ۞</button>
                </div>

                <span id="footerJuz" style="font-size: 12px; font-weight:bold;">الجزء: 1</span>
            </div>
        </div>

        <div id="adhkarSection" class="content-section">
            <h2 id="adhkarTitle" style="margin-bottom: 15px; text-align:center;">الأذكار</h2>
            <div id="adhkarContent"></div>
        </div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        const juzPages = [1, 22, 42, 62, 82, 102, 122, 142, 162, 182, 202, 222, 242, 262, 282, 302, 322, 342, 362, 382, 402, 422, 442, 462, 482, 502, 522, 542, 562, 582];
        let currentPage = parseInt(localStorage.getItem('saved_page')) || 1;
        let bookmarkedPage = parseInt(localStorage.getItem('bookmarked_page')) || 0;
        let selectedReciter = localStorage.getItem('selected_reciter') || 'ar.yasserdosssre';
        
        const audioPlayer = document.getElementById('audioPlayer');
        let currentPlayingSpan = null;

        function cleanSurahName(name) {
            return name ? name.replace(/سُورَةُ/g, "").replace(/سورة/g, "").trim() : "";
        }

        function toggleSidebar(e) {
            if(e) e.stopPropagation();
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function toggleSubMenu(id) { document.getElementById(id).classList.toggle('open'); }

        async function loadPage(p) {
            stopAudio();
            p = Math.max(1, Math.min(604, p));
            currentPage = p;
            
            // تطبيق اتجاه الإطار حسب الصفحة (فردية أو زوجية)
            const frame = document.getElementById('quranFrame');
            if (p % 2 === 0) {
                frame.classList.remove('odd-page');
                frame.classList.add('even-page');
            } else {
                frame.classList.remove('even-page');
                frame.classList.add('odd-page');
            }

            document.getElementById('quranText').innerText = "جاري التحميل...";
            document.getElementById('pageInput').value = p;

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/page/${p}/${selectedReciter}`);
                const data = await res.json();
                
                let surahNames = [];
                let juzNum = data.data.ayahs[0].juz;
                let pageContent = "";

                data.data.ayahs.forEach(a => {
                    let cleanedName = cleanSurahName(a.surah.name);
                    if (a.numberInSurah === 1) {
                        surahNames.push(cleanedName);
                        pageContent += `<div class="surah-banner">سورة ${cleanedName}</div>`;
                    }
                    
                    let audioUrl = a.audio || "";
                    pageContent += `<span class="ayah-span" data-audio="${audioUrl}" onclick="playAyahAudio(this)">${a.text} ﴿${a.numberInSurah}﴾ </span>`;
                });

                document.getElementById('quranText').innerHTML = pageContent;
                document.getElementById('footerSurahName').innerText = surahNames.join(' - ');
                document.getElementById('footerJuz').innerText = `الجزء: ${juzNum}`;
                
                updateBookmarkState();
                localStorage.setItem('saved_page', p);
                setTimeout(adjustQuranFontSize, 50);
            } catch (err) {
                document.getElementById('quranText').innerText = "تعذر تحميل الصفحة. يرجى التأكد من الاتصال بالإنترنت.";
            }
        }

        function playAyahAudio(span) {
            const audioUrl = span.getAttribute('data-audio');
            if (!audioUrl) return;

            if (currentPlayingSpan === span && !audioPlayer.paused) {
                stopAudio();
                return;
            }

            stopAudio();
            currentPlayingSpan = span;
            currentPlayingSpan.classList.add('playing');

            audioPlayer.src = audioUrl;
            audioPlayer.play();
            audioPlayer.onended = () => { stopAudio(); };
        }

        function stopAudio() {
            if (!audioPlayer.paused) { audioPlayer.pause(); }
            if (currentPlayingSpan) {
                currentPlayingSpan.classList.remove('playing');
                currentPlayingSpan = null;
            }
        }

        function updateBookmarkState() {
            const bookmarkIcon = document.getElementById('footerBookmark');
            if (currentPage === bookmarkedPage && bookmarkedPage !== 0) {
                bookmarkIcon.classList.add('active');
            } else {
                bookmarkIcon.classList.remove('active');
            }
        }

        function toggleBookmark(e) {
            if(e) e.stopPropagation();
            bookmarkedPage = (bookmarkedPage === currentPage) ? 0 : currentPage;
            localStorage.setItem('bookmarked_page', bookmarkedPage);
            updateBookmarkState();
        }

        function goToBookmark() {
            if (bookmarkedPage > 0) { showSection('quran'); loadPage(bookmarkedPage); }
            else { alert("لم تقم بحفظ أي صفحة بعد."); }
        }

        function adjustQuranFontSize() {
            const frame = document.getElementById('quranFrame');
            const page = document.getElementById('quranText');
            if (!frame || !page) return;

            let size = 26;
            document.documentElement.style.setProperty('--quran-font-size', size + 'px');

            while ((page.scrollHeight > frame.clientHeight || page.offsetHeight > frame.clientHeight) && size > 11) {
                size -= 0.4;
                document.documentElement.style.setProperty('--quran-font-size', size + 'px');
            }
        }

        function jumpToPage() {
            let val = parseInt(document.getElementById('pageInput').value);
            if(val >= 1 && val <= 604) { loadPage(val); }
        }

        let startX = 0;
        document.getElementById('mainContainer').addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive: true});
        document.getElementById('mainContainer').addEventListener('touchend', e => {
            let endX = e.changedTouches[0].clientX;
            if (endX - startX > 50 && currentPage < 604) { loadPage(currentPage + 1); }
            else if (startX - endX > 50 && currentPage > 1) { loadPage(currentPage - 1); }
        });

        function showSection(id) {
            document.querySelectorAll('.quran-wrapper, .content-section').forEach(el => el.style.display = 'none');
            if(id === 'quran') { 
                document.getElementById('quranSection').style.display = 'flex'; 
                adjustQuranFontSize();
            } else { 
                document.getElementById(id + 'Section').style.display = 'block'; 
            }
        }

        window.onload = () => { loadPage(currentPage); };
        window.onresize = () => { adjustQuranFontSize(); };
    </script>
</body>
</html>
